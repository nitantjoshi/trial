<!DOCTYPE html>
<html>
<head>
    <title>language selection</title>

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn1 {
            background: blue;
        }

        .btn2 {
            background: green;
        }

        .btn3 {
            background: red;
        }
    </style>
</head>

<body>

    <div class="buttons">
      <a href="https://raw.githubusercontent.com/nitantjoshi/trial/refs/heads/main/420853.jpg"><button class="btn1">gujrati</button></a>
        <a href="https://raw.githubusercontent.com/nitantjoshi/trial/refs/heads/main/420853%20(2).jpg"><button class="btn2">hindi</button></a>
        <a href="https://raw.githubusercontent.com/nitantjoshi/trial/refs/heads/main/420853(1).jpg"><button class="btn3">english</button></a>
    </div>

</body>
</html>
